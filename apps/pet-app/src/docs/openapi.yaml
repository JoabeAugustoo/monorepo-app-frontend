      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseDto'
        '401':
          description: Invalid or expired refresh token
      summary: Refresh access token using refresh token
      tags:
        - Authentication
  /api/auth/validate:
    post:
      operationId: AuthController_validate
      parameters:
        - name: authorization
          required: true
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPayloadDto'
        '401':
          description: Invalid or expired token
      security:
        - bearer: []
      summary: Validate current token from Authorization header
      tags:
        - Authentication
