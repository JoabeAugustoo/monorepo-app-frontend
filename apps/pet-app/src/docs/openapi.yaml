      required:
        - content
    CompleteProcedureDto:
      type: object
      properties:
        medications:
          description: Medications used
          type: array
          items:
            $ref: '#/components/schemas/ProcedureMedicationDto'
        notes:
          description: Final notes
          type: array
          items:
            $ref: '#/components/schemas/MedicalNoteDto'
        observations:
          type: string
          description: Final observations
    MedicalProcedureDto:
      type: object
      properties:
