info:
  title: Petflow API
  description: API for Petflow application
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: http://localhost:8084
    description: Local development
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        username:
          type: string
          description: Username or email
        password:
          type: string
          description: User password
        applicationId:
          type: string
          description: Application public ID (UUID)
      required:
        - username
        - password
    TokenResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: JWT refresh token
        tokenType:
          type: string
          description: Token type (Bearer)
        expiresIn:
          type: number
          description: Access token expiration time in seconds
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token
      required:
        - refreshToken
    TokenPayloadDto:
      type: object
      properties:
        sub:
          type: string
          description: User/Client public ID
        app:
          type: string
          description: Application code (e.g., "vendamax", "auth")
        username:
          type: string
          description: Username
        email:
          type: string
          description: User email
        roles:
          description: User/Client roles in the application
          type: array
          items:
            type: string
        iat:
          type: number
          description: Token issued at timestamp
        exp:
          type: number
          description: Token expiration timestamp
      required:
        - sub
        - app
        - username
        - email
        - roles
    CustomerDto:
      type: object
      properties:
        name:
          type: string
          description: Customer full name
          maxLength: 150
        cpf:
          type: string
          description: 'CPF (format: 000.000.000-00)'
          maxLength: 14
        rg:
          type: string
          description: RG document
          maxLength: 20
        email:
          type: string
          description: Email address
          maxLength: 150
        phone:
          type: string
          description: Primary phone number
          maxLength: 20
        secondaryPhone:
          type: string
          description: Secondary/emergency phone
          maxLength: 20
        notes:
          type: string
          description: Internal notes about the customer
        street:
          type: string
          description: Street name
          maxLength: 200
        number:
          type: string
          description: Address number
          maxLength: 20
        complement:
          type: string
          description: Address complement
          maxLength: 100
        neighborhood:
          type: string
          description: Neighborhood
          maxLength: 100
        city:
          type: string
          description: City
          maxLength: 100
        state:
          type: string
          description: State (2 letters)
          maxLength: 2
        zipCode:
          type: string
          description: Zip code
          maxLength: 10
      required:
        - name
        - phone
    CustomerResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        name:
          type: string
          description: Customer full name
        cpf:
          type: string
          description: CPF
        rg:
          type: string
          description: RG
        email:
          type: string
          description: Email
        phone:
          type: string
          description: Primary phone
        secondaryPhone:
          type: string
          description: Secondary phone
        notes:
          type: string
          description: Notes
        street:
          type: string
          description: Street
        number:
          type: string
          description: Number
        complement:
          type: string
          description: Complement
        neighborhood:
          type: string
          description: Neighborhood
        city:
          type: string
          description: City
        state:
          type: string
          description: State
        zipCode:
          type: string
          description: Zip code
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - name
        - phone
    CountResponse:
      type: object
      properties:
        total:
          type: number
          description: Total number of records
          example: 100
        active:
          type: number
          description: Number of active records
          example: 85
        inactive:
          type: number
          description: Number of inactive records
          example: 15
      required:
        - total
        - active
        - inactive
    SearchRequest:
      type: object
      properties:
        where:
          type: object
          description: Filter conditions
          example:
            active: true
            name: Example
          additionalProperties: true
        skip:
          type: number
          description: Number of records to skip (pagination offset)
          example: 0
          default: 0
          minimum: 0
        take:
          type: number
          description: Number of records to return (pagination limit)
          example: 10
          default: 10
          minimum: 1
        sort:
          description: Sort fields and directions
          example:
            - field: createdAt
              direction: DESC
          type: array
          items:
            type: array
      required:
        - skip
        - take
    EmployeeResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        name:
          type: string
          description: Employee full name
        cpf:
          type: string
          description: CPF
        email:
          type: string
          description: Email
        phone:
          type: string
          description: Phone
        role:
          type: string
          description: Role
        crmv:
          type: string
          description: CRMV number
        hireDate:
          format: date-time
          type: string
          description: Hire date
        status:
          type: string
          description: Employment status
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - name
        - cpf
        - role
        - hireDate
        - status
    EmployeeDto:
      type: object
      properties:
        name:
          type: string
          description: Employee full name
          maxLength: 150
        cpf:
          type: string
          description: 'CPF (format: 000.000.000-00)'
          maxLength: 14
        email:
          type: string
          description: Email
          maxLength: 150
        phone:
          type: string
          description: Phone
          maxLength: 20
        role:
          type: string
          description: Employee role
          enum:
            - VETERINARIAN
            - ATTENDANT
            - ADMINISTRATIVE
            - MANAGER
        crmv:
          type: string
          description: CRMV number (required for VETERINARIAN)
          maxLength: 20
        hireDate:
          type: string
          description: Hire date (ISO format)
          example: '2024-01-15'
      required:
        - name
        - cpf
        - role
        - hireDate
    PetTutorResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        customerId:
          type: string
          description: Customer public ID
        customerName:
          type: string
          description: Customer name
        role:
          type: string
          description: Tutor role
        relationship:
          type: string
          description: Relationship
        canAuthorize:
          type: boolean
          description: Can authorize procedures
        canPickup:
          type: boolean
          description: Can pickup pet
        startDate:
          format: date-time
          type: string
          description: Start date
        endDate:
          format: date-time
          type: string
          description: End date
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - customerId
        - customerName
        - role
        - canAuthorize
        - canPickup
        - startDate
    PetResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        name:
          type: string
          description: Pet name
        species:
          type: string
          description: Species
        breed:
          type: string
          description: Breed
        gender:
          type: string
          description: Gender
        birthDate:
          format: date-time
          type: string
          description: Birth date
        weight:
          type: number
          description: Weight in kg
        color:
          type: string
          description: Color
        observations:
          type: string
          description: Observations
        status:
          type: string
          description: Pet status
        tutors:
          description: Tutors
          type: array
          items:
            $ref: '#/components/schemas/PetTutorResponseDto'
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - name
        - species
        - status
    PetTutorDto:
      type: object
      properties:
        customerId:
          type: string
          description: Customer public ID (UUID)
        role:
          type: string
          description: Tutor role
          enum:
            - PRIMARY
            - SECONDARY
            - TEMPORARY
        relationship:
          type: string
          description: Relationship to pet
          maxLength: 50
        canAuthorize:
          type: boolean
          description: Can authorize procedures
          default: false
        canPickup:
          type: boolean
          description: Can pickup pet
          default: true
        endDate:
          type: string
          description: End date for temporary tutors
      required:
        - customerId
        - role
    PetDto:
      type: object
      properties:
        name:
          type: string
          description: Pet name
          maxLength: 100
        species:
          type: string
          description: Species
          enum:
            - DOG
            - CAT
            - BIRD
            - REPTILE
            - OTHER
        breed:
          type: string
          description: Breed
          maxLength: 100
        gender:
          type: string
          description: Gender
          enum:
            - MALE
            - FEMALE
            - UNKNOWN
        birthDate:
          type: string
          description: Birth date (ISO format)
          example: '2020-05-15'
        weight:
          type: number
          description: Weight in kg
          example: 12.5
        color:
          type: string
          description: Color/coat
          maxLength: 50
        observations:
          type: string
          description: Observations
        primaryTutorId:
          type: string
          description: Primary tutor (customer) public ID
      required:
        - name
        - species
        - primaryTutorId
    ProcedureMedicationResponseDto:
      type: object
      properties:
        medicationId:
          type: string
          description: Medication public ID
        medicationName:
          type: string
          description: Medication name
        quantity:
          type: number
          description: Quantity
        dosage:
          type: string
          description: Dosage
        batchId:
          type: string
          description: Batch public ID
      required:
        - medicationId
        - medicationName
        - quantity
        - dosage
    MedicalNoteResponseDto:
      type: object
      properties:
        content:
          type: string
          description: Note content
        authorId:
          type: string
          description: Author ID
        createdAt:
          format: date-time
          type: string
          description: Created at
      required:
        - content
        - authorId
        - createdAt
    MedicalProcedureResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        type:
          type: string
          description: Procedure type
        location:
          type: string
          description: Location
        description:
          type: string
          description: Description
        date:
          format: date-time
          type: string
          description: Procedure date
        cost:
          type: number
          description: Cost
        observations:
          type: string
          description: Observations
        status:
          type: string
          description: Status
        petId:
          type: string
          description: Pet public ID
        petName:
          type: string
          description: Pet name
        veterinarianId:
          type: string
          description: Veterinarian public ID
        veterinarianName:
          type: string
          description: Veterinarian name
        medications:
          description: Medications used
          type: array
          items:
            $ref: '#/components/schemas/ProcedureMedicationResponseDto'
        notes:
          description: Medical notes
          type: array
          items:
            $ref: '#/components/schemas/MedicalNoteResponseDto'
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - type
        - location
        - description
        - date
        - cost
        - status
        - petId
        - veterinarianId
    ProcedureMedicationDto:
      type: object
      properties:
        medicationId:
          type: string
          description: Medication public ID
        quantity:
          type: number
          description: Quantity used
          example: 2.5
        dosage:
          type: string
          description: Dosage administered
          maxLength: 200
      required:
        - medicationId
        - quantity
        - dosage
    MedicalNoteDto:
      type: object
      properties:
        content:
          type: string
