openapi: 3.0.0
info:
  title: Petflow API
  description: API for Petflow application
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: http://localhost:8084
    description: Local development
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        username:
          type: string
          description: Username or email
        password:
          type: string
          description: User password
        applicationId:
          type: string
          description: Application public ID (UUID)
      required:
        - username
        - password
    TokenResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: JWT refresh token
        tokenType:
          type: string
          description: Token type (Bearer)
        expiresIn:
          type: number
          description: Access token expiration time in seconds
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token
      required:
        - refreshToken
    TokenConfigDto:
      type: object
      properties:
        theme:
          type: string
          description: Application theme
          example: claro
      required:
        - theme
    TokenPayloadDto:
      type: object
      properties:
        sub:
          type: string
          description: User/Client public ID
        app:
          type: string
          description: Application code
        username:
          type: string
          description: Username
        email:
          type: string
          description: User email
        roles:
          description: User/Client roles in the application
          type: array
          items:
            type: string
        config:
          description: User config for the application
          allOf:
            - $ref: '#/components/schemas/TokenConfigDto'
        iat:
          type: number
          description: Token issued at timestamp
        exp:
          type: number
          description: Token expiration timestamp
      required:
        - sub
        - app
        - username
        - email
        - roles
    UpdateThemeDto:
      type: object
      properties:
        theme:
          type: string
          description: Theme name
          enum: [claro, escuro, oceano, sunset, nord, pet, azul]
          example: claro
      required:
        - theme
    CountResponse:
      type: object
      properties:
        total:
          type: number
          example: 100
        active:
          type: number
          example: 85
        inactive:
          type: number
          example: 15
      required: [total, active, inactive]
    SearchRequest:
      type: object
      properties:
        where:
          type: object
          description: Filter conditions
          additionalProperties: true
        skip:
          type: number
          default: 0
          minimum: 0
        take:
          type: number
          default: 10
          minimum: 1
        sort:
          description: Sort fields and directions
          type: array
          items:
            type: array
      required: [skip, take]
    AddressResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        zipCode:
          type: string
        street:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
      required: [publicId, active, createdAt, updatedAt, zipCode, street, neighborhood, city, state]
    CustomerAddressResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        number:
          type: string
        complement:
          type: string
        notes:
          type: string
        isDefault:
          type: boolean
        address:
          $ref: '#/components/schemas/AddressResponseDto'
      required: [publicId, active, createdAt, updatedAt, isDefault, address]
    CustomerResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        name:
          type: string
        cpf:
          type: string
        rg:
          type: string
        email:
          type: string
        phone:
          type: string
        secondaryPhone:
          type: string
        notes:
          type: string
        city:
          type: string
        state:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAddressResponseDto'
      required: [publicId, active, createdAt, updatedAt, name, phone]
    AddressDto:
      type: object
      properties:
        zipCode:
          type: string
          maxLength: 10
        street:
          type: string
          description: Street name (if provided, skips external API lookup)
          maxLength: 200
        neighborhood:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 2
        number:
          type: string
          maxLength: 20
        complement:
          type: string
          maxLength: 100
        notes:
          type: string
        isDefault:
          type: boolean
          default: false
      required: [zipCode]
    UpdateCustomerAddressDto:
      type: object
      properties:
        number:
          type: string
          maxLength: 20
        complement:
          type: string
          maxLength: 100
        notes:
          type: string
        isDefault:
          type: boolean
    CustomerDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        cpf:
          type: string
          maxLength: 14
        rg:
          type: string
          maxLength: 20
        email:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        secondaryPhone:
          type: string
          maxLength: 20
        notes:
          type: string
      required: [name, phone]
    ClinicResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        tradeName:
          type: string
        legalName:
          type: string
        cnpj:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        logoUrl:
          type: string
        logoSvg:
          type: string
      required: [publicId, active, createdAt, updatedAt, tradeName, legalName, cnpj, phone, email]
    ClinicDto:
      type: object
      properties:
        tradeName:
          type: string
          maxLength: 150
        legalName:
          type: string
          maxLength: 200
        cnpj:
          type: string
          maxLength: 18
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          maxLength: 150
        address:
          type: string
          maxLength: 300
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 2
      required: [tradeName, legalName, cnpj, phone, email]
    EmployeeDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        cpf:
          type: string
          maxLength: 14
        email:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        role:
          type: string
          enum: [VETERINARIAN, ATTENDANT, ADMINISTRATIVE, MANAGER]
        crmv:
          type: string
          maxLength: 20
        hireDate:
          type: string
          example: '2024-01-15'
        createAuthUser:
          type: boolean
          default: true
      required: [name, cpf, role, hireDate]
    EmployeeCreateResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        name:
          type: string
        cpf:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
        crmv:
          type: string
        hireDate:
          format: date-time
          type: string
        status:
          type: string
        employeeGuid:
          type: string
        authUserGuid:
          type: string
        hasAuthAccess:
          type: boolean
        generatedUserName:
          type: string
        generatedPassword:
          type: string
        isExistingUser:
          type: boolean
      required: [publicId, active, createdAt, updatedAt, name, cpf, role, hireDate, status, hasAuthAccess, generatedUserName, generatedPassword, isExistingUser]
    EmployeeResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        name:
          type: string
        cpf:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
        crmv:
          type: string
        hireDate:
          format: date-time
          type: string
        status:
          type: string
        employeeGuid:
          type: string
        authUserGuid:
          type: string
        hasAuthAccess:
          type: boolean
      required: [publicId, active, createdAt, updatedAt, name, cpf, role, hireDate, status, hasAuthAccess]
    PetTutorResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        customerId:
          type: string
        customerName:
          type: string
        role:
          type: string
        relationship:
          type: string
        canAuthorize:
          type: boolean
        canPickup:
          type: boolean
        startDate:
          format: date-time
          type: string
        endDate:
          format: date-time
          type: string
      required: [publicId, active, createdAt, updatedAt, customerId, customerName, role, canAuthorize, canPickup, startDate]
    PetResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
        gender:
          type: string
        birthDate:
          format: date-time
          type: string
        weight:
          type: number
        color:
          type: string
        observations:
          type: string
        status:
          type: string
        primaryTutorName:
          type: string
        primaryTutorCpf:
          type: string
        tutors:
          type: array
          items:
            $ref: '#/components/schemas/PetTutorResponseDto'
      required: [publicId, active, createdAt, updatedAt, name, species, status]
    PetTutorDto:
      type: object
      properties:
        customerId:
          type: string
        role:
          type: string
          enum: [PRIMARY, SECONDARY, TEMPORARY]
        relationship:
          type: string
          maxLength: 50
        canAuthorize:
          type: boolean
          default: false
        canPickup:
          type: boolean
          default: true
        endDate:
          type: string
      required: [customerId, role]
    PetDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        species:
          type: string
          enum: [DOG, CAT, BIRD, REPTILE, OTHER]
        breed:
          type: string
          maxLength: 100
        gender:
          type: string
          enum: [MALE, FEMALE, UNKNOWN]
        birthDate:
          type: string
          example: '2020-05-15'
        weight:
          type: number
          example: 12.5
        color:
          type: string
          maxLength: 50
        observations:
          type: string
        primaryTutorId:
          type: string
      required: [name, species, primaryTutorId]
    ProcedureMedicationResponseDto:
      type: object
      properties:
        medicationId:
          type: string
        medicationName:
          type: string
        quantity:
          type: number
        dosage:
          type: string
        batchId:
          type: string
      required: [medicationId, medicationName, quantity, dosage]
    MedicalNoteResponseDto:
      type: object
      properties:
        content:
          type: string
        authorId:
          type: string
        createdAt:
          format: date-time
          type: string
      required: [content, authorId, createdAt]
    MedicalProcedureResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        type:
          type: string
        location:
          type: string
        description:
          type: string
        date:
          format: date-time
          type: string
        cost:
          type: number
        observations:
          type: string
        status:
          type: string
        petId:
          type: string
        petName:
          type: string
        veterinarianId:
          type: string
        veterinarianName:
          type: string
        clinicalVisitId:
          type: string
        medications:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureMedicationResponseDto'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/MedicalNoteResponseDto'
      required: [publicId, active, createdAt, updatedAt, type, location, description, date, cost, status, petId, veterinarianId]
    ProcedureMedicationDto:
      type: object
      properties:
        medicationId:
          type: string
        quantity:
          type: number
          example: 2.5
        dosage:
          type: string
          maxLength: 200
      required: [medicationId, quantity, dosage]
    MedicalNoteDto:
      type: object
      properties:
        content:
          type: string
      required: [content]
    CompleteProcedureDto:
      type: object
      properties:
        medications:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureMedicationDto'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/MedicalNoteDto'
        observations:
          type: string
    MedicalProcedureDto:
      type: object
      properties:
        type:
          type: string
          enum: [CONSULTATION, SURGERY, EXAM, VACCINATION, GROOMING, OTHER]
        location:
          type: string
          enum: [IN_CLINIC, HOME_VISIT, PARTNER, EXTERNAL]
          default: IN_CLINIC
        description:
          type: string
        date:
          type: string
        cost:
          type: number
          example: 150
        observations:
          type: string
        petId:
          type: string
        veterinarianId:
          type: string
        clinicalVisitId:
          type: string
        medications:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureMedicationDto'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/MedicalNoteDto'
      required: [type, description, date, cost, petId, veterinarianId]
    ClinicalVisitSummaryDto:
      type: object
      properties:
        procedureCount:
          type: number
        medicationCount:
          type: number
        documentCount:
          type: number
        totalCost:
          type: number
      required: [procedureCount, medicationCount, documentCount, totalCost]
    ClinicalVisitResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        type:
          type: string
        status:
          type: string
        chiefComplaint:
          type: string
        notes:
          type: string
        startedAt:
          format: date-time
          type: string
        completedAt:
          format: date-time
          type: string
        petId:
          type: string
        petName:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        veterinarianId:
          type: string
        veterinarianName:
          type: string
        lastUpdatedAt:
          format: date-time
          type: string
        summary:
          $ref: '#/components/schemas/ClinicalVisitSummaryDto'
      required: [publicId, active, createdAt, updatedAt, type, status, startedAt, petId, customerId, veterinarianId]
    DocumentTrackingResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        reportId:
          type: string
        templateKey:
          type: string
        status:
          type: string
          enum: [GENERATING, REPORT_FAILED, REPORT_COMPLETED, NO_SIGNATURE_REQUIRED, UPLOADING_TO_SIGNATURE, AWAITING_SIGNATURES, PARTIALLY_SIGNED, COMPLETED, EXPIRED, FAILED, CANCELLED]
        errorMessage:
          type: string
        signatureDocumentId:
          type: string
        petId:
          type: string
        customerId:
          type: string
        documentName:
          type: string
        clinicalVisitId:
          type: string
      required: [publicId, active, createdAt, updatedAt, reportId, templateKey, status]
    TimelineEntryDto:
      type: object
      properties:
        entryType:
          type: string
          enum: [VISIT_STARTED, PROCEDURE, DOCUMENT, VISIT_COMPLETED, VISIT_CANCELLED]
        date:
          format: date-time
          type: string
        publicId:
          type: string
        title:
          type: string
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
        procedure:
          $ref: '#/components/schemas/MedicalProcedureResponseDto'
        document:
          $ref: '#/components/schemas/DocumentTrackingResponseDto'
      required: [entryType, date, publicId, title, status]
    ClinicalVisitDto:
      type: object
      properties:
        type:
          type: string
          enum: [CONSULTATION, HOSPITALIZATION, FOLLOW_UP, EMERGENCY]
        petId:
          type: string
        customerId:
          type: string
        veterinarianId:
          type: string
        chiefComplaint:
          type: string
          maxLength: 2000
        notes:
          type: string
          maxLength: 5000
      required: [type, petId, customerId, veterinarianId]
    MedicationResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        name:
          type: string
        type:
          type: string
        defaultDosage:
          type: string
        manufacturer:
          type: string
        description:
          type: string
        minimumStock:
          type: number
        currentStock:
          type: number
      required: [publicId, active, createdAt, updatedAt, name, type, minimumStock]
    MedicationDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        type:
          type: string
          enum: [INTERNAL, EXTERNAL, CONTROLLED]
        defaultDosage:
          type: string
          maxLength: 200
        manufacturer:
          type: string
          maxLength: 150
        description:
          type: string
        minimumStock:
          type: number
          default: 0
      required: [name, type]
    StockBatchResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        medicationId:
          type: string
        medicationName:
          type: string
        batchNumber:
          type: string
        quantity:
          type: number
        initialQuantity:
          type: number
        unitCost:
          type: number
        expirationDate:
          format: date-time
          type: string
        entryDate:
          format: date-time
          type: string
        status:
          type: string
      required: [publicId, active, createdAt, updatedAt, medicationId, medicationName, batchNumber, quantity, initialQuantity, unitCost, expirationDate, entryDate, status]
    StockBatchDto:
      type: object
      properties:
        medicationId:
          type: string
        batchNumber:
          type: string
          maxLength: 50
        quantity:
          type: number
          example: 100
        unitCost:
          type: number
          example: 25.5
        expirationDate:
          type: string
          example: '2025-12-31'
      required: [medicationId, batchNumber, quantity, unitCost, expirationDate]
    StockMovementDto:
      type: object
      properties:
        type:
          type: string
          enum: [ENTRY, EXIT_PROCEDURE, EXIT_SALE, ADJUSTMENT, DISPOSAL]
        medicationId:
          type: string
        batchId:
          type: string
        quantity:
          type: number
          example: 10
        performedById:
          type: string
        reason:
          type: string
        referenceId:
          type: string
      required: [type, medicationId, batchId, quantity, performedById]
    StockMovementResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        type:
          type: string
        quantity:
          type: number
        reason:
          type: string
        referenceId:
          type: string
        medicationId:
          type: string
        medicationName:
          type: string
        batchId:
          type: string
        batchNumber:
          type: string
        performedById:
          type: string
        performedByName:
          type: string
      required: [publicId, active, createdAt, updatedAt, type, quantity, medicationId, medicationName, batchId, batchNumber, performedById, performedByName]
    RevenueDto:
      type: object
      properties:
        category:
          type: string
          enum: [PROCEDURE, PRODUCT_SALE, OTHER]
        description:
          type: string
          maxLength: 500
        amount:
          type: number
          example: 250
        date:
          type: string
          example: '2024-01-15'
        status:
          type: string
          enum: [PENDING, PAID, OVERDUE, CANCELLED]
          default: PENDING
        customerId:
          type: string
        procedureId:
          type: string
      required: [category, description, amount, date]
    RevenueResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        category:
          type: string
        description:
          type: string
        amount:
          type: number
        date:
          format: date-time
          type: string
        status:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        procedureId:
          type: string
      required: [publicId, active, createdAt, updatedAt, category, description, amount, date, status]
    ExpenseDto:
      type: object
      properties:
        category:
          type: string
          enum: [STOCK_PURCHASE, RENT, SALARY, UTILITIES, MAINTENANCE, OTHER]
        description:
          type: string
          maxLength: 500
        amount:
          type: number
          example: 500
        date:
          type: string
          example: '2024-01-15'
        costType:
          type: string
          enum: [FIXED, VARIABLE]
        status:
          type: string
          enum: [PENDING, PAID, OVERDUE, CANCELLED]
          default: PENDING
        referenceId:
          type: string
      required: [category, description, amount, date, costType]
    ExpenseResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        category:
          type: string
        description:
          type: string
        amount:
          type: number
        date:
          format: date-time
          type: string
        costType:
          type: string
        status:
          type: string
        referenceId:
          type: string
      required: [publicId, active, createdAt, updatedAt, category, description, amount, date, costType, status]
    DebtInstallmentResponseDto:
      type: object
      properties:
        publicId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        installmentNumber:
          type: number
