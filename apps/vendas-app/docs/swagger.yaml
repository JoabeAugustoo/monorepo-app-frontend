          example: 99.99
        suggestedSalePrice:
          type: number
          description: Suggested sale price
          example: 129.99
        isNewClient:
          type: boolean
          description: Is a new client
          default: false
        date:
          type: string
          description: Sale date (YYYY-MM-DD)
          example: '2026-02-02'
        notes:
          type: string
          description: Additional notes
          maxLength: 500
      required:
