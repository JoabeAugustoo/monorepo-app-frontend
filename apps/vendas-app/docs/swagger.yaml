info:
  title: Vendamax API
  description: API for Vendamax application
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: http://localhost:8083
    description: Local development
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        username:
          type: string
          description: Username or email
        password:
          type: string
          description: User password
        applicationId:
          type: string
          description: Application public ID (UUID)
      required:
        - username
        - password
    TokenResponseVendasDto:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: JWT refresh token
        tokenType:
          type: string
          description: Token type (Bearer)
        expiresIn:
          type: number
          description: Access token expiration time in seconds
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token
      required:
        - refreshToken
    TokenResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: JWT refresh token
        tokenType:
          type: string
          description: Token type (Bearer)
        expiresIn:
          type: number
          description: Access token expiration time in seconds
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    TokenPayloadDto:
      type: object
      properties:
        sub:
          type: string
          description: User/Client public ID
        app:
          type: string
          description: Application code (e.g., "vendamax", "auth")
        username:
          type: string
          description: Username
        email:
          type: string
          description: User email
        roles:
          description: User/Client roles in the application
          type: array
          items:
            type: string
        iat:
          type: number
          description: Token issued at timestamp
        exp:
          type: number
          description: Token expiration timestamp
      required:
        - sub
        - app
        - username
        - email
        - roles
    ProductResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        name:
          type: string
          description: Product name
        price:
          type: number
          description: Product price
        suggestedSalePrice:
          type: number
          description: Suggested sale price
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - name
        - price
    SearchRequest:
      type: object
      properties:
        where:
          type: object
          description: Filter conditions
          example:
            active: true
            name: Example
          additionalProperties: true
        skip:
          type: number
          description: Number of records to skip (pagination offset)
          example: 0
          default: 0
          minimum: 0
        take:
          type: number
          description: Number of records to return (pagination limit)
          example: 10
          default: 10
          minimum: 1
        sort:
          description: Sort fields and directions
          example:
            - field: createdAt
              direction: DESC
          type: array
          items:
            type: array
      required:
        - skip
        - take
    ProductDto:
      type: object
      properties:
        name:
          type: string
          description: Product name
          maxLength: 255
        price:
          type: number
          description: Product price
          example: 99.99
        suggestedSalePrice:
          type: number
          description: Suggested sale price
          example: 129.99
      required:
        - name
        - price
    CountResponse:
      type: object
      properties:
        total:
          type: number
          description: Total number of records
          example: 100
        active:
          type: number
          description: Number of active records
          example: 85
        inactive:
          type: number
          description: Number of inactive records
          example: 15
      required:
        - total
        - active
        - inactive
    EmployeeDto:
      type: object
      properties:
        name:
          type: string
          description: Employee full name (first and last name)
          maxLength: 255
        email:
          type: string
          description: Employee email
          maxLength: 255
        monthlySalary:
          type: number
          description: Monthly salary
          example: 3500
        startTime:
          type: string
          description: Start time (HH:mm format)
          example: '08:00'
        endTime:
          type: string
          description: End time (HH:mm format)
          example: '17:00'
        hoursPerDay:
          type: number
          description: Hours per day
          example: 8
        daysPerWeek:
          type: number
          description: Days per week
          example: 5
        createAuthUser:
          type: boolean
          description: Whether to create auth user in security-api
          default: true
      required:
        - name
        - monthlySalary
        - startTime
        - endTime
        - hoursPerDay
        - daysPerWeek
    EmployeeCreateResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        name:
          type: string
          description: Employee full name
        email:
          type: string
          description: Employee email
        monthlySalary:
          type: number
          description: Monthly salary
        startTime:
          type: string
          description: Start time
        endTime:
          type: string
          description: End time
        hoursPerDay:
          type: number
          description: Hours per day
        daysPerWeek:
          type: number
          description: Days per week
        employeeGuid:
          type: string
          description: Employee GUID
        authUserGuid:
          type: string
          description: Auth User GUID (reference to security-api User)
        hasAuthAccess:
          type: boolean
          description: Whether the employee has auth access in security-api
        generatedUserName:
          type: string
          description: Generated username for authentication
        generatedPassword:
          type: string
          description: >-
            Generated password (only returned on new user creation, empty if
            user already existed)
        isExistingUser:
          type: boolean
          description: Whether the auth user already existed in the security system
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - name
        - monthlySalary
        - startTime
        - endTime
        - hoursPerDay
        - daysPerWeek
        - hasAuthAccess
        - generatedUserName
        - generatedPassword
        - isExistingUser
    EmployeeResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        name:
          type: string
          description: Employee full name
        email:
          type: string
          description: Employee email
        monthlySalary:
          type: number
          description: Monthly salary
        startTime:
          type: string
          description: Start time
        endTime:
          type: string
          description: End time
        hoursPerDay:
          type: number
          description: Hours per day
        daysPerWeek:
          type: number
          description: Days per week
        employeeGuid:
          type: string
          description: Employee GUID
        authUserGuid:
          type: string
          description: Auth User GUID (reference to security-api User)
        hasAuthAccess:
          type: boolean
          description: Whether the employee has auth access in security-api
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - name
        - monthlySalary
        - startTime
        - endTime
        - hoursPerDay
        - daysPerWeek
        - hasAuthAccess
    TotalResponseDto:
      type: object
      properties:
        total:
          type: number
          description: Total value
          example: 15000
      required:
        - total
    DailySalesDto:
      type: object
      properties:
        day:
          type: string
          description: Day of month (zero-padded)
          example: '01'
        sales:
          type: number
          description: Number of sales
        amount:
          type: number
          description: Total amount
      required:
        - day
        - sales
        - amount
    EmployeePerformanceDto:
      type: object
      properties:
        employeeId:
          type: string
          description: Employee public ID
        employeeName:
          type: string
          description: Employee name
        sales:
          type: number
          description: Number of sales
        amount:
          type: number
          description: Total amount
      required:
        - employeeId
        - employeeName
        - sales
        - amount
    SaleDto:
      type: object
      properties:
        employeePublicId:
          type: string
          description: Employee public ID (UUID)
        productPublicId:
          type: string
          description: Product public ID (UUID)
        clientName:
          type: string
          description: Client name
          maxLength: 100
        quantity:
          type: number
          description: Quantity sold
          example: 1
        salePrice:
          type: number
