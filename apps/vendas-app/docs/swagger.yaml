openapi: 3.0.0
paths:
  /api/health:
    get:
      operationId: HealthController_health
      parameters: []
      responses:
        '200':
          description: Service is healthy
      summary: Health check endpoint
      tags:
        - Health
  /api/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseVendasDto'
        '401':
          description: Invalid credentials
        '503':
          description: Auth service unavailable
      summary: Authenticate user and get tokens
      tags:
        - Authentication
  /api/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseDto'
        '401':
          description: Invalid or expired refresh token
      summary: Refresh access token using refresh token
      tags:
        - Authentication
  /api/auth/validate:
    post:
      operationId: AuthController_validate
      parameters:
        - name: authorization
          required: true
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPayloadDto'
        '401':
          description: Invalid or expired token
      security:
        - bearer: []
      summary: Validate current token from Authorization header
      tags:
        - Authentication
  /api/auth/introspect:
    post:
      operationId: AuthController_introspect
      parameters:
        - name: authorization
          required: true
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Token introspection result
      security:
        - bearer: []
      summary: Introspect token from Authorization header
      tags:
        - Authentication
