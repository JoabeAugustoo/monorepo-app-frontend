              $ref: '#/components/schemas/AssignRoleDto'
      responses:
        '201':
          description: Role assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleResponseDto'
        '400':
          description: Invalid input or role already assigned
        '404':
          description: User, Application or Role not found
      security:
        - bearer: []
      summary: Assign a role to a user in an application
      tags:
        - User Roles
  /api/user-roles/revoke:
    delete:
      operationId: UserRoleController_revokeRole
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleDto'
      responses:
        '204':
          description: Role revoked successfully
        '404':
          description: User, Application or Role not found
      security:
        - bearer: []
      summary: Revoke a role from a user in an application
      tags:
        - User Roles
  /api/user-roles/user/{userId}:
    get:
      operationId: UserRoleController_getUserRoles
      parameters:
        - name: userId
          required: true
          in: path
          description: User public ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: List of user roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleResponseDto'
        '404':
          description: User not found
      security:
        - bearer: []
      summary: Get all roles for a user across all applications
      tags:
        - User Roles
  /api/user-roles/user/{userId}/application/{applicationId}:
    get:
      operationId: UserRoleController_getUserRolesByApplication
      parameters:
        - name: userId
          required: true
          in: path
          description: User public ID (UUID)
          schema:
            type: string
        - name: applicationId
          required: true
          in: path
          description: Application public ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: List of user roles in application
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleResponseDto'
        '404':
          description: User or Application not found
      security:
        - bearer: []
      summary: Get user roles for a specific application
      tags:
        - User Roles
  /api/user-roles/application/{applicationId}:
    get:
      operationId: UserRoleController_getApplicationUsers
      parameters:
        - name: applicationId
          required: true
          in: path
          description: Application public ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: List of user roles in application
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleResponseDto'
        '404':
          description: Application not found
      security:
        - bearer: []
      summary: Get all users and their roles for an application
      tags:
        - User Roles
  /api/applications/{appPublicId}/clients:
    post:
      operationId: ClientController_create
      parameters:
        - name: appPublicId
          required: true
          in: path
          description: Application public ID (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientDto'
      responses:
        '201':
          description: Client created successfully. The secret is only shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientWithSecretResponseDto'
        '400':
          description: Invalid input or application not active
        '404':
          description: Application not found
      security:
        - bearer: []
      summary: Create a new client for an application
      tags:
        - Clients
    get:
      operationId: ClientController_findByApplication
      parameters:
        - name: appPublicId
          required: true
          in: path
          description: Application public ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientResponseDto'
        '404':
          description: Application not found
      security:
        - bearer: []
      summary: List all clients for an application
      tags:
        - Clients
  /api/clients/stats/count:
    get:
      operationId: ClientController_count
      parameters: []
      responses:
        '200':
          description: Count statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
      security:
        - bearer: []
      summary: Get client count statistics
      tags:
        - Clients
  /api/clients/{clientPublicId}:
    get:
      operationId: ClientController_findById
      parameters:
        - name: clientPublicId
          required: true
          in: path
          description: Client public ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Client found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponseDto'
        '404':
          description: Client not found
      security:
        - bearer: []
      summary: Get a client by public ID
      tags:
        - Clients
    patch:
      operationId: ClientController_update
      parameters:
        - name: clientPublicId
          required: true
          in: path
          description: Client public ID (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientDto'
      responses:
        '200':
          description: Client updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponseDto'
        '404':
          description: Client not found
      security:
        - bearer: []
      summary: Update a client
      tags:
        - Clients
    delete:
      operationId: ClientController_delete
      parameters:
        - name: clientPublicId
          required: true
          in: path
          description: Client public ID (UUID)
          schema:
            type: string
      responses:
        '204':
          description: Client deleted successfully
        '404':
          description: Client not found
      security:
        - bearer: []
      summary: Delete a client (soft delete)
      tags:
        - Clients
  /api/clients/search:
    post:
      operationId: ClientController_search
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientResponseDto'
      security:
        - bearer: []
      summary: Search clients with filters and pagination
      tags:
        - Clients
  /api/clients/{clientPublicId}/activate:
    patch:
      operationId: ClientController_activate
      parameters:
        - name: clientPublicId
          required: true
          in: path
          description: Client public ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Client activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponseDto'
        '404':
          description: Client not found
      security:
        - bearer: []
      summary: Activate a client
      tags:
        - Clients
  /api/clients/{clientPublicId}/deactivate:
    patch:
      operationId: ClientController_deactivate
      parameters:
        - name: clientPublicId
          required: true
          in: path
          description: Client public ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Client deactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponseDto'
        '404':
          description: Client not found
      security:
        - bearer: []
      summary: Deactivate a client
      tags:
        - Clients
  /api/clients/{clientPublicId}/rotate-secret:
    post:
      operationId: ClientController_rotateSecret
      parameters:
        - name: clientPublicId
          required: true
          in: path
          description: Client public ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Secret rotated. The new secret is only shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientWithSecretResponseDto'
        '400':
          description: Client is not active
        '404':
          description: Client not found
      security:
        - bearer: []
      summary: Rotate client secret
      tags:
        - Clients
  /api/clients/{clientPublicId}/roles:
    post:
      operationId: ClientController_assignRole
      parameters:
        - name: clientPublicId
          required: true
          in: path
          description: Client public ID (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignClientRoleBodyDto'
      responses:
        '201':
          description: Role assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRoleResponseDto'
        '400':
          description: Invalid input or role already assigned
        '404':
          description: Client or Role not found
      security:
        - bearer: []
      summary: Assign a role to a client
      tags:
        - Clients
  /api/clients/{clientPublicId}/roles/{rolePublicId}:
    delete:
      operationId: ClientController_removeRole
      parameters:
        - name: clientPublicId
          required: true
          in: path
          description: Client public ID (UUID)
          schema:
            type: string
        - name: rolePublicId
          required: true
          in: path
          description: Role public ID (UUID)
          schema:
            type: string
      responses:
        '204':
          description: Role removed successfully
        '400':
          description: Client does not have this role
        '404':
          description: Client or Role not found
      security:
        - bearer: []
      summary: Remove a role from a client (soft delete)
      tags:
        - Clients
  /api/oauth/token:
    post:
      operationId: ClientController_token
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCredentialsLoginDto'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientTokenResponseDto'
        '400':
          description: Invalid credentials or grant type
      summary: OAuth2 Client Credentials authentication
      tags:
        - Clients
info:
  title: Security API
  description: API for managing applications, users, and roles
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: http://localhost:3001
    description: Local development
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        username:
          type: string
          description: Username or email
        password:
          type: string
          description: User password
        applicationId:
          type: string
          description: Application public ID (UUID)
      required:
        - username
        - password
    TokenResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: JWT refresh token
        tokenType:
          type: string
          description: Token type (Bearer)
        expiresIn:
          type: number
          description: Access token expiration time in seconds
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token
      required:
        - refreshToken
    TokenPayloadDto:
      type: object
      properties:
        sub:
          type: string
          description: User/Client public ID
        app:
          type: string
          description: Application code (e.g., "vendamax", "auth")
        roles:
          description: User/Client roles in the application
          type: array
          items:
            type: string
        iat:
          type: number
          description: Token issued at timestamp
        exp:
          type: number
          description: Token expiration timestamp
      required:
        - sub
        - app
        - roles
    UserRoleResponseDto:
      type: object
      properties:
        userId:
          type: string
          description: User public ID
        userName:
          type: string
          description: Username
        applicationId:
          type: string
          description: Application public ID
        applicationName:
          type: string
          description: Application name
        roleId:
          type: string
          description: Role public ID
        roleName:
          type: string
          description: Role name
        active:
          type: boolean
          description: Whether the association is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
      required:
        - userId
        - userName
        - applicationId
        - applicationName
        - roleId
        - roleName
        - active
        - createdAt
    SearchRequest:
      type: object
      properties:
        where:
          type: object
          description: Filter conditions
          example:
            active: true
            name: Example
          additionalProperties: true
        skip:
          type: number
          description: Number of records to skip (pagination offset)
          example: 0
          default: 0
          minimum: 0
        take:
          type: number
          description: Number of records to return (pagination limit)
          example: 10
          default: 10
          minimum: 1
        sort:
          description: Sort fields and directions
          example:
            - field: createdAt
              direction: DESC
          type: array
          items:
            type: array
      required:
        - skip
        - take
    UserRoleItemDto:
      type: object
      properties:
        publicId:
          type: string
          description: Role public ID
        name:
          type: string
          description: Role name
        active:
          type: boolean
          description: Whether the role assignment is active
      required:
        - publicId
        - name
        - active
    ApplicationUserSearchResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: User public ID
        userName:
          type: string
          description: Username
        email:
          type: string
          description: User email
        firstName:
          type: string
          description: User first name
        lastName:
          type: string
          description: User last name
        enabled:
          type: boolean
          description: Whether the user is enabled
        active:
          type: boolean
          description: Whether the user is active
        createdAt:
          format: date-time
          type: string
          description: User creation date
        roles:
          description: List of roles assigned to this user
          type: array
          items:
            $ref: '#/components/schemas/UserRoleItemDto'
      required:
        - publicId
        - userName
        - email
        - enabled
        - active
        - createdAt
        - roles
    ApplicationRoleSearchResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Role public ID
        name:
          type: string
          description: Role name
        description:
          type: string
          description: Role description
        isAdministrative:
          type: boolean
          description: Whether the role is administrative
        isGlobal:
          type: boolean
          description: Whether the role is a global role
        active:
          type: boolean
          description: Whether the role is active
      required:
        - publicId
        - name
        - isAdministrative
        - isGlobal
        - active
    AddUserToApplicationDto:
      type: object
      properties:
        userPublicId:
          type: string
          description: User public ID (UUID)
        rolePublicIds:
          description: List of role public IDs to assign to the user
          type: array
          items:
            type: string
      required:
        - userPublicId
        - rolePublicIds
    AssignRoleBodyDto:
      type: object
      properties:
        rolePublicId:
          type: string
          description: Role public ID (UUID)
      required:
        - rolePublicId
    ApplicationGlobalRoleResponseDto:
      type: object
      properties:
        rolePublicId:
          type: string
          description: Role public ID
        roleName:
          type: string
          description: Role name
        roleDescription:
          type: string
          description: Role description
        active:
          type: boolean
          description: Whether this global role is active for the application
        createdAt:
          format: date-time
          type: string
          description: When the global role was enabled for this application
      required:
        - rolePublicId
        - roleName
        - roleDescription
        - active
        - createdAt
    EnableGlobalRoleDto:
      type: object
      properties:
        rolePublicId:
          type: string
          description: Public ID (UUID) of the global role to enable for this application
      required:
        - rolePublicId
    ApplicationDto:
      type: object
      properties:
        name:
          type: string
          description: Application name
          maxLength: 100
        code:
          type: string
          description: Unique application code (lowercase, alphanumeric with hyphens)
          maxLength: 50
          example: vendamax
        description:
          type: string
          description: Application description
          maxLength: 500
      required:
        - name
        - code
    ApplicationResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        name:
          type: string
          description: Application name
        code:
          type: string
          description: Unique application code
        description:
          type: string
          description: Application description
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - name
        - code
    CountResponse:
      type: object
      properties:
        total:
          type: number
          description: Total number of records
          example: 100
        active:
          type: number
          description: Number of active records
          example: 85
        inactive:
          type: number
          description: Number of inactive records
          example: 15
      required:
        - total
        - active
        - inactive
    RoleDto:
      type: object
      properties:
        name:
          type: string
          description: Role name
          maxLength: 50
        description:
          type: string
          description: Role description
          maxLength: 255
        applicationId:
          type: string
          description: Application public ID (UUID) - if not provided, role is global
        isAdministrative:
          type: boolean
          description: >-
            If true, this role cannot be assigned to clients
            (machine-to-machine)
          default: false
      required:
        - name
    RoleResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        name:
          type: string
          description: Role name
        description:
          type: string
          description: Role description
        applicationId:
          type: string
          description: Application public ID if role is scoped to an application
        isAdministrative:
          type: boolean
          description: If true, this role cannot be assigned to clients
          default: false
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - name
        - isAdministrative
    ApplicationInfoDto:
      type: object
      properties:
        public_id:
          type: string
          description: Application public ID (UUID)
        name:
          type: string
          description: Application name
      required:
        - public_id
        - name
    UserApplicationRolesDto:
      type: object
      properties:
        application:
          description: Application information
          allOf:
            - $ref: '#/components/schemas/ApplicationInfoDto'
        roles:
          description: List of role names
          type: array
          items:
            type: string
      required:
        - application
        - roles
    UserDto:
      type: object
      properties:
        userName:
          type: string
          description: Username
          maxLength: 50
        email:
          type: string
          description: User email
          maxLength: 100
        password:
          type: string
          description: User password
          minLength: 6
        firstName:
          type: string
          description: First name
          maxLength: 50
        lastName:
          type: string
          description: Last name
          maxLength: 50
      required:
        - userName
        - email
    UserResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        userGuid:
          type: string
          description: User GUID
        userName:
          type: string
          description: Username
        email:
          type: string
          description: User email
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        enabled:
          type: boolean
          description: Whether the user is enabled
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - userGuid
        - userName
        - email
        - enabled
    AssignRoleDto:
      type: object
      properties:
        userId:
          type: string
          description: User public ID (UUID)
        applicationId:
          type: string
          description: Application public ID (UUID)
        roleId:
          type: string
          description: Role public ID (UUID)
      required:
        - userId
        - applicationId
        - roleId
    CreateClientDto:
      type: object
      properties:
        name:
          type: string
          description: Client name
          maxLength: 100
        description:
          type: string
          description: Client description
          maxLength: 500
      required:
        - name
    ClientWithSecretResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        clientId:
          type: string
          description: Client ID used for authentication
        name:
          type: string
          description: Client name
        description:
          type: string
          description: Client description
        applicationId:
          type: string
          description: Application public ID
        applicationName:
          type: string
          description: Application name
        roles:
          description: List of assigned role names
          type: array
          items:
            type: string
        clientSecret:
          type: string
          description: Client secret (only shown once on creation or rotation)
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - clientId
        - name
        - applicationId
        - applicationName
        - roles
        - clientSecret
    ClientResponseDto:
      type: object
      properties:
        publicId:
          type: string
          description: Public UUID
        active:
          type: boolean
          description: Whether the record is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
        updatedAt:
          format: date-time
          type: string
          description: Last update date
        clientId:
          type: string
          description: Client ID used for authentication
        name:
          type: string
          description: Client name
        description:
          type: string
          description: Client description
        applicationId:
          type: string
          description: Application public ID
        applicationName:
          type: string
          description: Application name
        roles:
          description: List of assigned role names
          type: array
          items:
            type: string
      required:
        - publicId
        - active
        - createdAt
        - updatedAt
        - clientId
        - name
        - applicationId
        - applicationName
        - roles
    UpdateClientDto:
      type: object
      properties:
        name:
          type: string
          description: Client name
          maxLength: 100
        description:
          type: string
          description: Client description
          maxLength: 500
        active:
          type: boolean
          description: Whether the client is active
    AssignClientRoleBodyDto:
      type: object
      properties:
        rolePublicId:
          type: string
          description: Role public ID (UUID)
      required:
        - rolePublicId
    ClientRoleResponseDto:
      type: object
      properties:
        clientId:
          type: string
          description: Client public ID
        clientName:
          type: string
          description: Client name
        roleId:
          type: string
          description: Role public ID
        roleName:
          type: string
          description: Role name
        active:
          type: boolean
          description: Whether the association is active
        createdAt:
          format: date-time
          type: string
          description: Creation date
      required:
        - clientId
        - clientName
        - roleId
        - roleName
        - active
        - createdAt
    ClientCredentialsLoginDto:
      type: object
      properties:
        client_id:
          type: string
          description: Client ID
        client_secret:
          type: string
          description: Client secret
        grant_type:
          type: string
          description: Grant type (must be "client_credentials")
          example: client_credentials
      required:
