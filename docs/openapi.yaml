      responses:
        '201':
          description: Role assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleResponseDto'
        '400':
          description: >-
            Invalid input, role already assigned, or role not available for
            application
        '404':
          description: User, Application, or Role not found
      security:
        - bearer: []
      summary: Assign a role to a user in this application
      tags:
        - Applications
