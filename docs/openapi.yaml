openapi: 3.0.0
paths:
  /api/health:
    get:
      operationId: HealthController_health
      parameters: []
      responses:
        '200':
          description: Service is healthy
      summary: Health check endpoint
      tags:
        - Health
  /api/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseDto'
        '401':
          description: Invalid credentials
        '503':
          description: Auth service unavailable
      summary: Authenticate user and get tokens
      tags:
        - Authentication
  /api/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseDto'
        '401':
          description: Invalid or expired refresh token
      summary: Refresh access token using refresh token
      tags:
        - Authentication
  /api/auth/validate:
    post:
      operationId: AuthController_validate
      parameters:
        - name: authorization
          required: true
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPayloadDto'
        '401':
          description: Invalid or expired token
      security:
        - bearer: []
      summary: Validate current token from Authorization header
      tags:
        - Authentication
  /api/auth/introspect:
    post:
      operationId: AuthController_introspect
      parameters:
        - name: authorization
          required: true
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Token introspection result
      security:
        - bearer: []
      summary: Introspect token from Authorization header
      tags:
        - Authentication
  /api/applications/{appPublicId}/users:
    get:
      operationId: ApplicationController_getApplicationUsers
      parameters:
        - name: appPublicId
          required: true
          in: path
          description: Application public ID (UUID)
          schema:
            type: string
      responses:
        '200':
          description: List of users with their roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleResponseDto'
        '404':
          description: Application not found
      security:
        - bearer: []
      summary: List all users and their roles in this application
      tags:
        - Applications
    post:
      operationId: ApplicationController_addUserToApplication
      parameters:
        - name: appPublicId
          required: true
          in: path
          description: Application public ID (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserToApplicationDto'
      responses:
        '201':
          description: User added to application successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationUserSearchResponseDto'
        '400':
          description: Invalid input or role not available for application
        '404':
          description: User, Application, or Role not found
      security:
        - bearer: []
      summary: Add a user to this application with initial roles
      tags:
        - Applications
  /api/applications/{appPublicId}/users/search:
    post:
      operationId: ApplicationController_searchApplicationUsers
      parameters:
        - name: appPublicId
          required: true
          in: path
          description: Application public ID (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Paginated list of users with their roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationUserSearchResponseDto'
        '404':
          description: Application not found
      security:
        - bearer: []
      summary: Search users in this application with pagination
      tags:
        - Applications
  /api/applications/{appPublicId}/roles/search:
    post:
